name: Sign Shortcut
on: push
jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: plutil -convert binary1 Allinone.shortcut
      - run: shortcuts sign --mode anyone --input Allinone.shortcut --output Signed_Allinone.shortcut
      - uses: actions/upload-artifact@v4
        with:
          name: SignedShortcut
          path: Signed_Allinone.shortcut
